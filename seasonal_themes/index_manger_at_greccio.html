<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Manger at Greccio. A Christmas greeting from Professor Steven Austin.">
  <title>The Manger at Greccio | Professor Steven Austin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&amp;family=Lora:wght@400;500;600&amp;family=Inter:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <!-- TEMPORARY SEASONAL THEME: The Manger at Greccio (December 25 to December 29). Full-page painting. To publish: copy this file over public/index.html. To revert or reach the course homepage: public/index_standard.html. -->
  <style>
    :root {
      --gold: #d4b24a;
      --ivory: #fff6e6;
      --lapis: #163a68;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Lora, Georgia, serif;
      color: var(--ivory);
      background-color: #120e0a;
      background-image: url("images/manger_at_greccio/hero.webp");
      background-size: cover;
      background-position: center 50%;
      background-repeat: no-repeat;
    }
    .skip-link {
      position: absolute;
      left: -999px;
      top: 0;
      background: #fff;
      color: #111;
      padding: 0.5rem 0.8rem;
      z-index: 100;
    }
    .skip-link:focus { left: 0.5rem; top: 0.5rem; }
    .manger-caption {
      position: fixed;
      left: 0.85rem;
      bottom: 0.85rem;
      z-index: 2;
      width: min(260px, calc(100% - 1.7rem));
      padding: 0.45rem 0.6rem 0.5rem;
      background: rgba(16, 12, 8, 0.42);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 246, 230, 0.22);
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
    }
    .manger-caption .lyceum-line {
      display: inline-block;
      margin: 0 0 0.25rem;
      padding: 0.12rem 0.55rem;
      font: 800 0.68rem/1.2 Inter, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #fffaf0;
      background: rgba(20, 12, 6, 0.8);
      border: 1px solid rgba(255, 220, 150, 0.85);
      border-radius: 999px;
    }
    .manger-caption h1 {
      margin: 0;
      font: 650 0.78rem/1.25 'Playfair Display', serif;
      color: var(--ivory);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }
    .manger-caption .greeting {
      margin: 0.18rem 0 0.28rem;
      font: 500 0.68rem/1.3 Inter, sans-serif;
      color: #ead9b0;
    }
    .home-link {
      display: inline-block;
      color: var(--gold);
      font: 600 0.68rem/1.2 Inter, sans-serif;
      letter-spacing: 0.02em;
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }
    .home-link:hover, .home-link:focus-visible { color: var(--ivory); }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .sz-fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
    .sz-fx-toggle {
      position: fixed;
      top: 0.7rem;
      right: 0.7rem;
      z-index: 60;
      border: 0;
      border-radius: 999px;
      padding: 0.28rem 0.5rem;
      background: rgba(16, 12, 8, 0.55);
      color: var(--ivory);
      font: 600 0.65rem/1 Inter, sans-serif;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
      cursor: pointer;
    }
    .sz-fx-toggle:hover, .sz-fx-toggle:focus-visible { background: rgba(22, 58, 104, 0.9); }
    .sz-spark {
      position: absolute;
      top: -40px;
      width: 10px;
      height: 10px;
      opacity: 0.85;
      animation: sz-fall linear infinite, sz-sway ease-in-out infinite alternate, sz-twinkle ease-in-out infinite;
      filter: drop-shadow(0 0 5px rgba(212, 178, 74, 0.95));
    }
    @keyframes sz-fall { to { transform: translateY(115vh) rotate(240deg); } }
    @keyframes sz-sway { from { margin-left: -22px; } to { margin-left: 22px; } }
    @keyframes sz-twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sz-fx, .sz-fx-toggle { display: none; }
    }
    @media (max-width: 400px) {
      .manger-caption h1 { white-space: normal; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#manger-card">Skip to page information</a>
  <main id="manger-card" class="manger-caption" title="St. Francis of Assisi arranged a living nativity at Greccio in 1223. AI-generated illustration.">
    <p class="lyceum-line">The Lyceum</p>
    <h1>The Manger at Greccio, 1223</h1>
    <p class="greeting">Merry Christmas from Professor Austin</p>
    <a class="home-link" href="index_standard.html">Course homepage</a>
    <p class="visually-hidden">St. Francis of Assisi arranged a living nativity at Greccio in 1223. AI-generated illustration.</p>
  </main>
  <script>
    /* Temporary seasonal animation (decorative only) */
    (() => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const sparkPath = 'M12 1 L13.5 9 L22 10 L15 14.5 L17 23 L12 18 L7 23 L9 14.5 L2 10 L10.5 9 Z';
      const layer = document.createElement('div');
      layer.className = 'sz-fx';
      layer.setAttribute('aria-hidden', 'true');
      const count = window.innerWidth < 700 ? 8 : 16;
      for (let i = 0; i < count; i++) {
        const spark = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        spark.setAttribute('viewBox', '0 0 24 24');
        spark.classList.add('sz-spark');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', sparkPath);
        path.setAttribute('fill', i % 2 === 0 ? '#f3e0a0' : '#d4b24a');
        spark.appendChild(path);
        const size = 8 + Math.random() * 12;
        spark.style.width = size + 'px';
        spark.style.height = size + 'px';
        spark.style.left = (Math.random() * 100) + 'vw';
        const fall = 14 + Math.random() * 16;
        const sway = 3 + Math.random() * 4;
        const twinkle = 1.6 + Math.random() * 2;
        spark.style.animationDuration = fall + 's, ' + sway + 's, ' + twinkle + 's';
        spark.style.animationDelay = (-Math.random() * fall) + 's, 0s, 0s';
        layer.appendChild(spark);
      }
      document.body.appendChild(layer);
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'sz-fx-toggle';
      toggle.setAttribute('aria-pressed', 'true');
      toggle.textContent = '\u2728 Pause';
      toggle.addEventListener('click', () => {
        const hidden = layer.style.display === 'none';
        layer.style.display = hidden ? '' : 'none';
        toggle.setAttribute('aria-pressed', String(hidden));
        toggle.textContent = hidden ? '\u2728 Pause' : '\u2728 Shimmer';
      });
      document.body.appendChild(toggle);
    })();
  </script>
</body>
</html>
