    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        
        // Val Town proxy URL
        const WORKER_URL = 'https://phil120tutor.val.run/';
        // The system prompt and the guard logic live in the plain script above (window.PhronimosLogic).
        
        // SVG Icons
        const BookOpen = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
        );
        
        const Send = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        );
        
        const AlertCircle = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );
        
        const Download = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        );

        const PL = window.PhronimosLogic;
        const STORAGE_KEY = 'phil120-phronimos-v5';
        const BOT_VERSION = 'v5 (2026-11-20)';
        const INTRO_MESSAGE = { role: 'assistant', content: "I am the Phronimos.\n\nThe name is from your reading. Aristotle says the mean is fixed \"by that principle by which the man of practical wisdom would determine it.\" The Greek for that person is phronimos. I am named after a standard, not a sage \u2014 and I am not Aristotle. I will not tell you what he really meant.\n\nHow this works:\n\u2022 Paste your complete rough draft \u2014 at least three paragraphs covering all three elements.\n\u2022 I ask one question at a time about what you wrote. You answer here, in the chat.\n\u2022 You revise the essay yourself, afterward, on your own.\n\nTwo things worth knowing. A draft that is rough, unfinished, or partly wrong is exactly what I am here for, so do not polish it first. And I can be wrong about the reading \u2014 if I say something the text does not, tell me and we will look at the passage.\n\nPaste your draft when you are ready." };
        function loadSaved() {
            try {
                const raw = window.sessionStorage.getItem(STORAGE_KEY);
                if (!raw) return null;
                const saved = JSON.parse(raw);
                if (!saved || !Array.isArray(saved.messages) || !saved.messages.length) return null;
                return saved;
            } catch (e) { return null; }
        }
        async function callApi(system, msgs) {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    model: 'claude-sonnet-5-5',
                    thinking: { type: 'between_tools' },
                    max_tokens: 1000,
                    system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral', ttl: '1h' } }],
                    messages: msgs
                })
            });
            if (!response.ok) {
                let errorData = null;
                try { errorData = await response.json(); } catch (e) {}
                console.error('API Error:', errorData);
                throw new Error(`API request failed: ${response.status}`);
            }
            const data = await response.json();
            // Prompt-caching check: open DevTools (F12) > Console. Turn 1 should show cache_creation_input_tokens; later turns cache_read_input_tokens. Free: usage already comes back with every reply.
            if (data && data.usage) console.log('[philosophy_tutor-Aristotle usage]', data.usage);
            return (data.content || []).find(b => b && b.type === 'text')?.text?.trim() || '';
        }

        function PhilosophyTutor() {
            const saved = useRef(loadSaved()).current;
            const [messages, setMessages] = useState(saved ? saved.messages : [INTRO_MESSAGE]);
            const [engine, setEngine] = useState(saved && saved.engine ? saved.engine : PL.cloneState({}));
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [confirmReset, setConfirmReset] = useState(false);
            const messagesEndRef = useRef(null);
            const cancelResetRef = useRef(null);
            const inputRef = useRef(null);

            const verdict = engine.verdict;
            const closed = !!engine.closed;
            const lastMsg = messages[messages.length - 1];
            const needsRetry = !isLoading && messages.length > 1 && (lastMsg.isError || lastMsg.role === 'user');

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            // Persist the conversation and page state for this tab so a reload or a dropped connection never starts the student over.
            useEffect(() => {
                try { window.sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ messages, engine })); } catch (e) {}
            }, [messages, engine]);

            useEffect(() => {
                if (confirmReset && cancelResetRef.current) cancelResetRef.current.focus();
            }, [confirmReset]);

            const startOver = () => {
                try { window.sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
                setMessages([INTRO_MESSAGE]);
                setEngine(PL.cloneState({}));
                setInput('');
                setConfirmReset(false);
                setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
            };

            const downloadConversation = () => {
                let conversationText = "PHIL 120 The Phronimos - Aristotle, Nicomachean Ethics - Conversation History\n";
                conversationText += "Downloaded: " + new Date().toLocaleString() + "\n";
                conversationText += "Bot version: " + BOT_VERSION + "\n";
                conversationText += "=" .repeat(60) + "\n\n";
                
                messages.forEach((msg, idx) => {
                    if (idx === 0 || msg.isError) return;
                    const speaker = msg.role === 'user' ? 'STUDENT' : 'THE PHRONIMOS';
                    conversationText += `${speaker}:\n`;
                    conversationText += msg.content + "\n\n";
                    conversationText += "-".repeat(60) + "\n\n";
                });
                
                const blob = new Blob([conversationText], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `aristotle-phronimos-${new Date().toISOString().split('T')[0]}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            // Send one student turn. msgs must end with the student's message. Engine state only changes on success.
            const sendTurn = async (msgs) => {
                const clean = msgs.filter(m => !m.isError);
                const userMsg = clean[clean.length - 1];
                if (!userMsg || userMsg.role !== 'user') return;
                const history = clean.slice(1, -1);
                setMessages(clean);
                setIsLoading(true);
                try {
                    const result = await PL.runTurn({ history, userMessage: userMsg.content, state: engine, callApi });
                    if (result.log && (result.log.rewrites.length || result.log.fallbacks.length)) console.log('[philosophy_tutor-Aristotle guard]', result.log);
                    const updated = clean.slice(0, -1).concat([
                        Object.assign({}, userMsg, { kind: result.userKind }),
                        { role: 'assistant', content: result.text, inDialogue: result.inDialogue, verdict: result.verdict || undefined }
                    ]);
                    setMessages(updated);
                    setEngine(result.state);
                } catch (error) {
                    console.error('Error:', error);
                    setMessages(clean.concat([{
                        role: 'assistant',
                        isError: true,
                        content: 'The connection dropped before I could answer. Nothing is lost: your conversation and progress are saved. Select Retry to send your last message again. If the problem persists, contact your instructor.'
                    }]));
                } finally {
                    setIsLoading(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!input.trim() || isLoading || closed) return;
                const userMessage = input.trim();
                setInput('');
                const base = messages.filter(m => !m.isError);
                // If the last student message never got an answer (connection error), the new one replaces it.
                const trimmed = (base.length > 1 && base[base.length - 1].role === 'user') ? base.slice(0, -1) : base;
                await sendTurn(trimmed.concat([{ role: 'user', content: userMessage }]));
            };

            const retryLast = () => {
                if (isLoading) return;
                sendTurn(messages);
            };

            const styles = {
                container: {
                    maxWidth: '900px',
                    margin: '0 auto',
                    background: 'linear-gradient(180deg, #1a1815 0%, #252220 100%)',
                    borderRadius: '8px',
                    overflow: 'hidden',
                    boxShadow: '0 25px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(163, 177, 138, 0.3)',
                },
                banner: { padding: '28px 20px 22px', textAlign: 'center', borderBottom: '3px solid rgba(143,176,196,0.45)', background: 'linear-gradient(180deg, #23282c 0%, #1a1815 100%)' },
                
                
                
                title: { color: '#A3B18A', fontSize: '2.1rem', fontWeight: '600', margin: '0 0 6px 0', letterSpacing: '0.14em' },
                subtitle: { color: '#cbd1c2', fontSize: '0.98rem', margin: 0, fontStyle: 'italic' },
                warningBox: {
                    margin: '16px',
                    padding: '14px 16px',
                    background: 'rgba(180, 130, 50, 0.15)',
                    border: '1px solid rgba(163, 177, 138, 0.3)',
                    borderLeft: '4px solid #A3B18A',
                    borderRadius: '6px',
                },
                warningTitle: {
                    color: '#A3B18A',
                    fontWeight: '600',
                    marginBottom: '4px',
                    fontSize: '0.95rem',
                },
                warningText: {
                    color: '#cbd1c2',
                    fontSize: '0.9rem',
                    lineHeight: 1.5,
                },
                messagesContainer: {
                    height: '420px',
                    overflowY: 'auto',
                    padding: '20px',
                    background: 'linear-gradient(180deg, rgba(26, 24, 21, 0.8) 0%, rgba(37, 34, 32, 0.8) 100%)',
                },
                messageWrapper: {
                    display: 'flex',
                    marginBottom: '16px',
                },
                userMessage: {
                    maxWidth: '80%',
                    padding: '14px 18px',
                    borderRadius: '18px 18px 4px 18px',
                    background: 'linear-gradient(135deg, #4a6741 0%, #3d5636 100%)',
                    border: '1px solid rgba(100, 140, 90, 0.4)',
                    boxShadow: '0 4px 15px rgba(0,0,0,0.3)',
                },
                assistantMessage: {
                    maxWidth: '80%',
                    padding: '14px 18px',
                    borderRadius: '18px 18px 18px 4px',
                    background: 'linear-gradient(135deg, #3d3632 0%, #2d2825 100%)',
                    border: '1px solid rgba(163, 177, 138, 0.2)',
                    boxShadow: '0 4px 15px rgba(0,0,0,0.3)',
                },
                messageLabel: {
                    fontSize: '0.7rem',
                    color: '#A3B18A',
                    marginBottom: '6px',
                    letterSpacing: '0.1em',
                    textTransform: 'uppercase',
                    fontWeight: '600',
                },
                messageText: {
                    color: '#c8c0b0',
                    margin: 0,
                    fontSize: '1rem',
                    lineHeight: 1.7,
                    whiteSpace: 'pre-wrap',
                },
                userMessageText: {
                    color: '#e8e4d9',
                },
                inputArea: {
                    padding: '16px 20px',
                    borderTop: '1px solid rgba(163, 177, 138, 0.2)',
                    background: 'linear-gradient(180deg, #1f1c19 0%, #1a1815 100%)',
                },
                inputRow: {
                    display: 'flex',
                    gap: '12px',
                    alignItems: 'flex-end',
                },
                textarea: {
                    flex: 1,
                    padding: '12px 16px',
                    borderRadius: '10px',
                    border: '1px solid rgba(163, 177, 138, 0.3)',
                    background: 'rgba(0, 0, 0, 0.3)',
                    color: '#e8e4d9',
                    fontSize: '1rem',
                    fontFamily: "'Cormorant Garamond', Georgia, serif",
                    resize: 'none',
                    minHeight: '70px',
                    outline: 'none',
                },
                sendButton: {
                    padding: '12px 24px',
                    borderRadius: '10px',
                    border: 'none',
                    background: 'linear-gradient(135deg, #A3B18A 0%, #7D8C68 100%)',
                    color: '#1a1815',
                    fontSize: '1rem',
                    fontFamily: "'Cormorant Garamond', Georgia, serif",
                    fontWeight: '600',
                    cursor: 'pointer',
                    letterSpacing: '0.05em',
                    boxShadow: '0 4px 15px rgba(163, 177, 138, 0.3)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    height: '70px',
                },
                sendButtonDisabled: {
                    background: 'linear-gradient(135deg, #4a4540 0%, #3a3530 100%)',
                    color: '#706050',
                    cursor: 'not-allowed',
                    boxShadow: 'none',
                },
                downloadButton: {
                    display: 'flex',
                    alignItems: 'center',
                    gap: '8px',
                    padding: '8px 16px',
                    borderRadius: '8px',
                    border: '1px solid rgba(163, 177, 138, 0.4)',
                    background: 'transparent',
                    color: '#A3B18A',
                    fontSize: '0.9rem',
                    fontFamily: "'Cormorant Garamond', Georgia, serif",
                    cursor: 'pointer',
                },
                footer: {
                    textAlign: 'center',
                    color: '#cbd1c2',
                    fontSize: '0.95rem',
                    marginTop: '16px',
                    fontStyle: 'italic',
                    textShadow: '0 1px 3px rgba(0, 0, 0, 0.5)',
                },
                toolRow: { marginTop: '12px', display: 'flex', flexWrap: 'wrap', justifyContent: 'flex-end', alignItems: 'center', gap: '10px' },
                confirmBox: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '8px' },
                confirmText: { color: '#e8e4d9', fontSize: '0.95rem' },
                errorMessage: { border: '1px solid #d9a066' },
                closedNote: { color: '#cbd1c2', fontSize: '0.95rem', margin: '10px 0 0 0' },
                verdictBanner: { margin: '0 20px 16px', padding: '16px 18px',
                    background: 'linear-gradient(135deg, #1f1c19 0%, #1a1815 100%)',
                    border: '2px solid #A3B18A', borderRadius: '8px', textAlign: 'center' },
                verdictTitle: { color: '#A3B18A', fontSize: '1.25rem', fontWeight: '600',
                    letterSpacing: '0.08em', margin: '0 0 6px 0' },
                verdictText: { color: '#cbd1c2', fontSize: '0.98rem', margin: '0 0 6px 0' },
                verdictNote: { color: '#a5ad98', fontSize: '0.85rem', fontStyle: 'italic', margin: '0 0 14px 0' },
                verdictButton: { display: 'inline-flex', alignItems: 'center', gap: '8px',
                    padding: '10px 22px', borderRadius: '8px', border: 'none', background: '#A3B18A',
                    color: '#1a1815', fontSize: '1rem', fontFamily: "'Cormorant Garamond', Georgia, serif",
                    fontWeight: '600', cursor: 'pointer' },
                loadingDot: {
                    width: '8px',
                    height: '8px',
                    borderRadius: '50%',
                    background: '#A3B18A',
                    display: 'inline-block',
                    margin: '0 3px',
                    animation: 'bounce 1.4s ease-in-out infinite',
                },
            };

            return (
                <div>
                    <style>{`
                        @keyframes bounce {
                            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
                            40% { transform: translateY(-8px); opacity: 1; }
                        }
                        textarea::placeholder { color: #706050; }
                        textarea:focus { border-color: rgba(163, 177, 138, 0.6) !important; box-shadow: 0 0 20px rgba(163, 177, 138, 0.15); }
                    `}</style>
                    
                    <div style={styles.container}>
                        {/* Greek Key Top */}
                        <div className="greek-key greek-key-top"></div>
                        
                        {/* Banner */}
                        <div style={styles.banner}>
                            <h1 style={styles.title}>THE PHRONIMOS</h1>
                            <p style={styles.subtitle}>PHIL 120 &middot; Aristotle, Nicomachean Ethics &middot; Richland Community College</p>
                        </div>
                        
                        {/* Warning Box */}
                        <div style={styles.warningBox}>
                            <div style={{display: 'flex', alignItems: 'flex-start', gap: '10px'}}>
                                <AlertCircle size={20} style={{color: '#A3B18A', flexShrink: 0, marginTop: '2px'}} />
                                <div>
                                    <p style={styles.warningTitle}>How to use this</p>
                                    <p style={styles.warningText}>Paste your complete rough draft to begin. This tool asks questions about your reading. It will NOT write your essay, supply a thesis, or tell you what Aristotle really meant. Your instructor will know if you used AI to generate text instead of doing your own thinking.</p>
                                    <p style={{...styles.warningText, marginTop: '6px'}}>Your conversation is saved in this browser tab, so reloading the page or losing the connection will not erase it.</p>
                                </div>
                            </div>
                            {messages.length > 1 && (
                                <div style={styles.toolRow}>
                                    {!confirmReset ? (
                                        <button type="button" onClick={() => setConfirmReset(true)} style={styles.downloadButton} disabled={isLoading}>
                                            <span>Start over</span>
                                        </button>
                                    ) : (
                                        <div role="group" aria-labelledby="reset-q" style={styles.confirmBox}>
                                            <span id="reset-q" style={styles.confirmText}>Erase this conversation and start over? Download it first if you need it.</span>
                                            <button type="button" onClick={startOver} style={styles.downloadButton}>Yes, erase it</button>
                                            <button type="button" ref={cancelResetRef} onClick={() => setConfirmReset(false)} style={styles.downloadButton}>Cancel</button>
                                        </div>
                                    )}
                                    {!verdict && (
                                        <button type="button" onClick={downloadConversation} style={styles.downloadButton}>
                                            <Download size={18} />
                                            <span>Download Conversation</span>
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                        
                        {/* Messages */}
                        <div style={styles.messagesContainer} role="log" aria-label="Conversation with The Phronimos" tabIndex={0}>
                            {messages.map((msg, idx) => (
                                <div
                                    key={idx}
                                    style={{
                                        ...styles.messageWrapper,
                                        justifyContent: msg.role === 'user' ? 'flex-end' : 'flex-start',
                                    }}
                                >
                                    <div style={msg.role === 'user' ? styles.userMessage : (msg.isError ? {...styles.assistantMessage, ...styles.errorMessage} : styles.assistantMessage)}>
                                        {msg.role === 'assistant' && (
                                            <div style={styles.messageLabel}>{msg.isError ? 'Connection problem' : 'The Phronimos'}</div>
                                        )}
                                        <p style={{...styles.messageText, ...(msg.role === 'user' ? styles.userMessageText : {})}}>
                                            {msg.content}
                                        </p>
                                    </div>
                                </div>
                            ))}
                            {isLoading && (
                                <div style={{...styles.messageWrapper, justifyContent: 'flex-start'}}>
                                    <div style={styles.assistantMessage}>
                                        <div style={styles.messageLabel}>The Phronimos</div>
                                        <div role="status" aria-live="polite" aria-label="The Phronimos is thinking">
                                            <span style={{...styles.loadingDot, animationDelay: '0s'}}></span>
                                            <span style={{...styles.loadingDot, animationDelay: '0.2s'}}></span>
                                            <span style={{...styles.loadingDot, animationDelay: '0.4s'}}></span>
                                        </div>
                                    </div>
                                </div>
                            )}
                            {needsRetry && (
                                <div style={{...styles.messageWrapper, justifyContent: 'flex-start'}}>
                                    <button type="button" onClick={retryLast} style={styles.verdictButton}>Retry</button>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>
                        {verdict && (
                            <div style={styles.verdictBanner} role="status">
                                <p style={styles.verdictText}>
                                    {verdict === 'REQUIREMENTS MET' && !closed
                                      ? 'You can keep going on the open thread named above by replying below, or stop here, download your conversation, and take it into your revision.'
                                      : 'This conversation is closed. Download it and submit it with your essay and your original draft.'}
                                </p>
                                <p style={styles.verdictNote}>
                                    {verdict === 'REQUIREMENTS MET' && !closed
                                      ? 'This is not a grade. Your instructor grades the assignment.'
                                      : 'This closes the conversation only. Your instructor grades the assignment.'}
                                </p>
                                <button onClick={downloadConversation} style={styles.verdictButton}>
                                    <Download size={18} />
                                    <span>Download Conversation</span>
                                </button>
                            </div>
                        )}

                        
                        {/* Input Area */}
                        <div style={styles.inputArea}>
                            <form onSubmit={handleSubmit}>
                                <div style={styles.inputRow}>
                                    <textarea
                                        ref={inputRef}
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        placeholder={closed ? 'This conversation is closed.' : 'Paste your rough draft to begin, or type your answer...'}
                                        aria-label="Your message to The Phronimos"
                                        aria-describedby={closed ? 'closed-note' : undefined}
                                        style={styles.textarea}
                                        rows="3"
                                        disabled={isLoading || closed}
                                    />
                                    <button
                                        type="submit"
                                        disabled={isLoading || closed || !input.trim()}
                                        style={{
                                            ...styles.sendButton,
                                            ...(isLoading || closed || !input.trim() ? styles.sendButtonDisabled : {}),
                                        }}
                                    >
                                        Inquire
                                    </button>
                                </div>
                            </form>
                            {closed && (
                                <p id="closed-note" style={styles.closedNote}>This conversation is closed. Use Download Conversation above to save it, or Start over for a new session.</p>
                            )}
                        </div>
                        
                        {/* Greek Key Bottom */}
                        <div className="greek-key greek-key-bottom"></div>
                    </div>
                    
                    <p style={styles.footer}>"Conduct has to do with individual cases" &middot; A thinking tool for revision, not a writing tool &middot; v5 &middot; 2026-11-20</p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PhilosophyTutor />);
    </script>
</body>
</html>
