<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 945" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky: charcoal → deep indigo → violet -->
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#0f1016"/>
      <stop offset="0.38" stop-color="#141a2c"/>
      <stop offset="0.68" stop-color="#16213e"/>
      <stop offset="1" stop-color="#2b1f3f"/>
    </linearGradient>

    <!-- Golden halo behind the skyline -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6e3a6" stop-opacity="0.92"/>
      <stop offset="0.32" stop-color="#d4af37" stop-opacity="0.55"/>
      <stop offset="0.68" stop-color="#b8862e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#b8862e" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal mist along the horizon -->
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c7873" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#2c7873" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2c7873" stop-opacity="0"/>
    </linearGradient>

    <!-- Ground -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d13"/>
      <stop offset="1" stop-color="#07080c"/>
    </linearGradient>

    <radialGradient id="vignette" cx="0.52" cy="0.46" r="0.76">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glowSmall" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.82  0 0 0 0 0.7  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- ============ SKY ============ -->
  <rect width="1680" height="945" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#efe6d2">
    <circle cx="120" cy="120" r="1.7" opacity="0.5"/>
    <circle cx="245" cy="210" r="1.2" opacity="0.35"/>
    <circle cx="330" cy="95" r="1.5" opacity="0.42"/>
    <circle cx="180" cy="330" r="1.3" opacity="0.3"/>
    <circle cx="415" cy="265" r="1.1" opacity="0.34"/>
    <circle cx="510" cy="140" r="1.8" opacity="0.4"/>
    <circle cx="90" cy="470" r="1.4" opacity="0.28"/>
    <circle cx="600" cy="330" r="1.2" opacity="0.3"/>
    <circle cx="700" cy="180" r="1.6" opacity="0.36"/>
    <circle cx="800" cy="95" r="1.3" opacity="0.32"/>
    <circle cx="880" cy="250" r="1.1" opacity="0.28"/>
    <circle cx="960" cy="130" r="1.5" opacity="0.34"/>
    <circle cx="1120" cy="180" r="1.2" opacity="0.3"/>
    <circle cx="1290" cy="150" r="1.7" opacity="0.36"/>
    <circle cx="1420" cy="215" r="1.3" opacity="0.3"/>
    <circle cx="1560" cy="140" r="1.5" opacity="0.34"/>
    <circle cx="1620" cy="300" r="1.2" opacity="0.28"/>
    <circle cx="1500" cy="80" r="1.4" opacity="0.32"/>
    <circle cx="270" cy="560" r="1.2" opacity="0.22"/>
    <circle cx="430" cy="640" r="1.4" opacity="0.2"/>
    <circle cx="140" cy="690" r="1.1" opacity="0.18"/>
  </g>

  <!-- ============ HALO ============ -->
  <circle cx="1250" cy="560" r="330" fill="url(#halo)"/>

  <!-- Mandala rings -->
  <g fill="none" stroke="#d4af37">
    <circle cx="1250" cy="560" r="205" stroke-width="1.5" opacity="0.35"/>
    <circle cx="1250" cy="560" r="250" stroke-width="2" opacity="0.5" stroke-dasharray="3 12"/>
    <circle cx="1250" cy="560" r="292" stroke-width="1.2" opacity="0.2"/>
  </g>

  <!-- ============ CONSTELLATION OF TRADITIONS ============ -->
  <!-- faint arc joining the symbols -->
  <path d="M1008,495 A250,250 0 0 1 1466,435" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.22"/>

  <g stroke="#f0dda2" fill="none" opacity="0.9" filter="url(#glowSmall)">
    <!-- Dharma wheel (1008, 495) -->
    <g stroke-width="2.4">
      <circle cx="1008" cy="495" r="26"/>
      <circle cx="1008" cy="495" r="6" fill="#f0dda2"/>
      <line x1="1008" y1="469" x2="1008" y2="521"/>
      <line x1="982" y1="495" x2="1034" y2="495"/>
      <line x1="990" y1="477" x2="1026" y2="513"/>
      <line x1="990" y1="513" x2="1026" y2="477"/>
    </g>

    <!-- Star of David (1064, 393) -->
    <g stroke-width="2.4">
      <polygon points="1064,371 1083,404 1045,404"/>
      <polygon points="1064,415 1045,382 1083,382"/>
    </g>

    <!-- Latin cross (1160, 327) -->
    <g stroke="none" fill="#f0dda2">
      <rect x="1156" y="301" width="8" height="52" rx="1.5"/>
      <rect x="1144" y="313" width="32" height="8" rx="1.5"/>
    </g>

    <!-- Crescent and star (1276, 311) -->
    <path fill="#f0dda2" stroke="none" fill-rule="evenodd"
          d="M1254,311 a22,22 0 1,0 44,0 a22,22 0 1,0 -44,0 Z
             M1262,307 a18,18 0 1,0 36,0 a18,18 0 1,0 -36,0 Z"/>
    <polygon fill="#f0dda2" stroke="none"
             points="1306,287 1308.5,293.6 1315.5,293.9 1310,298.3 1311.9,305.1 1306,301.2 1300.1,305.1 1302,298.3 1296.5,293.9 1303.5,293.6"/>

    <!-- Om-less: lotus (1386, 350) -->
    <g stroke-width="2.2">
      <path d="M1386,330 c9,10 9,24 0,34 c-9,-10 -9,-24 0,-34 Z"/>
      <path d="M1386,364 c-13,4 -25,-3 -29,-15 c13,-4 25,3 29,15 Z"/>
      <path d="M1386,364 c13,4 25,-3 29,-15 c-13,-4 -25,3 -29,15 Z"/>
      <path d="M1360,366 c14,8 38,8 52,0"/>
    </g>

    <!-- Yin and yang (1466, 435) -->
    <g>
      <circle cx="1466" cy="435" r="27" stroke-width="2.4"/>
      <path fill="#f0dda2" stroke="none" opacity="0.65"
            d="M1466,408 A27,27 0 0 1 1466,462 A13.5,13.5 0 0 1 1466,435 A13.5,13.5 0 0 0 1466,408 Z"/>
      <circle cx="1466" cy="421.5" r="4" fill="#16213e" stroke="none"/>
      <circle cx="1466" cy="448.5" r="4" fill="#f0dda2" stroke="none"/>
    </g>
  </g>

  <!-- ============ HORIZON MIST ============ -->
  <rect x="0" y="590" width="1680" height="180" fill="url(#mist)"/>

  <!-- ============ SKYLINE OF SACRED ARCHITECTURE ============ -->
  <g fill="#080a0f">

    <!-- Menorah (x 900) -->
    <g stroke="#080a0f" fill="none" stroke-width="6" stroke-linecap="round">
      <path d="M900,700 L900,646"/>
      <path d="M900,694 C900,662 888,652 874,652 L874,634"/>
      <path d="M900,694 C900,650 878,636 856,636 L856,620"/>
      <path d="M900,694 C900,640 868,620 842,620 L842,606"/>
      <path d="M900,694 C900,662 912,652 926,652 L926,634"/>
      <path d="M900,694 C900,650 922,636 944,636 L944,620"/>
      <path d="M900,694 C900,640 932,620 958,620 L958,606"/>
      <path d="M900,646 L900,632"/>
    </g>
    <path d="M868,702 L932,702 L924,720 L876,720 Z"/>

    <!-- Buddhist stupa (x 1000) -->
    <rect x="938" y="694" width="124" height="26"/>
    <path d="M945,695 A55,55 0 0 1 1055,695 Z"/>
    <rect x="986" y="676" width="28" height="19"/>
    <path d="M992,676 L1000,612 L1008,676 Z"/>
    <circle cx="1000" cy="606" r="6"/>
    <g stroke="#080a0f" stroke-width="3">
      <line x1="988" y1="662" x2="1012" y2="662"/>
      <line x1="990" y1="648" x2="1010" y2="648"/>
      <line x1="992" y1="634" x2="1008" y2="634"/>
    </g>

    <!-- Torii gate (x 1150) -->
    <rect x="1112" y="596" width="13" height="124"/>
    <rect x="1175" y="596" width="13" height="124"/>
    <rect x="1102" y="624" width="96" height="11"/>
    <path d="M1092,598 Q1150,574 1208,598 L1208,586 Q1150,562 1092,586 Z"/>

    <!-- Hindu shikhara temple (x 1300) -->
    <rect x="1248" y="688" width="104" height="32"/>
    <path d="M1256,690 C1266,616 1284,578 1300,558 C1316,578 1334,616 1344,690 Z"/>
    <ellipse cx="1300" cy="554" rx="17" ry="7"/>
    <path d="M1294,548 Q1300,534 1306,548 Z"/>
    <rect x="1298" y="524" width="4" height="16"/>
    <circle cx="1300" cy="521" r="5"/>

    <!-- Mosque with minaret (x 1450) -->
    <rect x="1398" y="666" width="104" height="54"/>
    <path d="M1402,668 Q1408,600 1450,594 Q1492,600 1498,668 Z"/>
    <rect x="1448" y="568" width="4" height="28"/>
    <path fill-rule="evenodd"
          d="M1438,558 a13,13 0 1,0 26,0 a13,13 0 1,0 -26,0 Z
             M1443,555 a10.5,10.5 0 1,0 21,0 a10.5,10.5 0 1,0 -21,0 Z"/>
    <rect x="1522" y="606" width="17" height="114"/>
    <rect x="1515" y="630" width="31" height="8"/>
    <path d="M1518,606 Q1530,572 1542,606 Z"/>
    <circle cx="1530" cy="568" r="5"/>

    <!-- Church with spire (x 1610) -->
    <rect x="1584" y="648" width="53" height="72"/>
    <path d="M1577,650 L1610,550 L1644,650 Z"/>
    <rect x="1607" y="518" width="7" height="34"/>
    <rect x="1597" y="526" width="27" height="7"/>
  </g>

  <!-- Incense smoke -->
  <g stroke="#d4af37" fill="none" opacity="0.13" filter="url(#soft)">
    <path d="M866,700 C880,650 850,616 868,566 C880,532 862,506 872,478" stroke-width="7"/>
    <path d="M1358,704 C1372,660 1346,630 1362,588" stroke-width="6"/>
  </g>

  <!-- ============ GROUND ============ -->
  <rect x="0" y="720" width="1680" height="225" fill="url(#ground)"/>
  <rect x="0" y="718" width="1680" height="2.5" fill="#d4af37" opacity="0.28"/>
  <!-- faint reflection of the halo on the ground -->
  <ellipse cx="1250" cy="722" rx="300" ry="46" fill="#d4af37" opacity="0.08" filter="url(#soft)"/>

  <!-- ============ ATMOSPHERE ============ -->
  <rect width="1680" height="945" fill="url(#vignette)"/>
  <rect width="1680" height="945" filter="url(#grain)" opacity="0.5" fill="none" pointer-events="none"/>
</svg>
