  <title id="map-title">Christianity beyond the Roman West</title>
  <desc id="map-desc">Selected places from different centuries. Gold highlights Great Moravia, teal highlights Armenia, purple highlights Aksum, and crimson highlights Merv and Kollam. Open circles identify Rome and Constantinople as reference cities.</desc>
