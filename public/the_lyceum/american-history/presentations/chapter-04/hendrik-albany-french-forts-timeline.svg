<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1664 934" role="img" aria-labelledby="title desc">
  <title id="title">From Hendrik's broken Covenant Chain to Fort Necessity, 1753–1754</title>
  <desc id="desc">A two-lane timeline showing Hendrik's 1753 ultimatum and the Albany Congress alongside French fort building, Jumonville Glen, and the defeat at Fort Necessity.</desc>
  <image x="0" y="0" width="1664" height="934" preserveAspectRatio="none" xlink:href="timeline-ohio-valley-base.png"/>
  <rect x="0" y="0" width="1664" height="934" fill="#f5f1e8" opacity=".27"/>

  <g font-family="Georgia, serif" fill="#1a1a1a">
    <text x="90" y="75" font-size="39" font-weight="700" fill="#6b4c9a">FROM A BROKEN CHAIN TO A FRONTIER WAR</text>
    <text x="92" y="112" font-size="21" fill="#2c7873">The diplomatic crisis and the military crisis unfolded at the same time.</text>
  </g>

  <g font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1a1a1a">
    <text x="245" y="165">1753</text>
    <text x="640" y="165">1754</text>
  </g>
  <path d="M190 180 H1480" stroke="#8b6f47" stroke-width="3"/>
  <path d="M500 168 V192 M760 168 V192 M1010 168 V192 M1270 168 V192" stroke="#8b6f47" stroke-width="2"/>
  <g font-family="Georgia, serif" font-size="15" fill="#5a4632">
    <text x="180" y="210">June</text><text x="425" y="210">September</text><text x="670" y="210">May</text><text x="930" y="210">June–July</text><text x="1250" y="210">July</text>
  </g>

  <rect x="90" y="245" width="1484" height="236" rx="18" fill="#f5f1e8" fill-opacity=".82" stroke="#6b4c9a" stroke-width="3"/>
  <rect x="90" y="510" width="1484" height="236" rx="18" fill="#f5f1e8" fill-opacity=".82" stroke="#9b2c2c" stroke-width="3"/>
  <g font-family="Georgia, serif">
    <text x="120" y="285" font-size="25" font-weight="700" fill="#6b4c9a">DIPLOMATIC TRACK</text>
    <text x="120" y="550" font-size="25" font-weight="700" fill="#9b2c2c">IMPERIAL / MILITARY TRACK</text>
  </g>

  <path d="M220 370 H1395" stroke="#6b4c9a" stroke-width="8" stroke-linecap="round" opacity=".65"/>
  <path d="M220 635 H1395" stroke="#9b2c2c" stroke-width="8" stroke-linecap="round" opacity=".65"/>

  <g font-family="Georgia, serif" fill="#1a1a1a">
    <circle cx="330" cy="370" r="13" fill="#6b4c9a" stroke="#f5f1e8" stroke-width="5"/>
    <text x="245" y="325" font-size="20" font-weight="700">June 1753</text>
    <text x="245" y="405" font-size="17">Hendrik declares</text>
    <text x="245" y="429" font-size="17">the Covenant Chain broken.</text>

    <circle cx="1085" cy="370" r="13" fill="#6b4c9a" stroke="#f5f1e8" stroke-width="5"/>
    <text x="950" y="325" font-size="20" font-weight="700">June 19–July 11, 1754</text>
    <text x="950" y="405" font-size="17">Albany Congress meets to repair</text>
    <text x="950" y="429" font-size="17">alliances and coordinate defense.</text>

    <circle cx="465" cy="635" r="13" fill="#9b2c2c" stroke="#f5f1e8" stroke-width="5"/>
    <text x="395" y="590" font-size="20" font-weight="700">1753</text>
    <text x="395" y="670" font-size="17">France builds forts at</text>
    <text x="395" y="694" font-size="17">Presque Isle and Le Boeuf.</text>

    <circle cx="835" cy="635" r="13" fill="#9b2c2c" stroke="#f5f1e8" stroke-width="5"/>
    <text x="755" y="590" font-size="20" font-weight="700">May 28, 1754</text>
    <text x="755" y="670" font-size="17">Jumonville Glen: Washington's</text>
    <text x="755" y="694" font-size="17">party kills Jumonville.</text>

    <circle cx="1250" cy="635" r="13" fill="#9b2c2c" stroke="#f5f1e8" stroke-width="5"/>
    <text x="1155" y="590" font-size="20" font-weight="700">July 3, 1754</text>
    <text x="1155" y="670" font-size="17">Fort Necessity: Washington</text>
    <text x="1155" y="694" font-size="17">surrenders at Great Meadows.</text>
  </g>

  <path d="M1085 450 V510" stroke="#8b6f47" stroke-width="3" stroke-dasharray="8 8"/>
  <g font-family="Georgia, serif">
    <rect x="525" y="782" width="615" height="84" rx="12" fill="#1a1a1a" fill-opacity=".88" stroke="#d4af37" stroke-width="2"/>
    <text x="550" y="817" font-size="18" font-weight="700" fill="#d4af37">THE OVERLAP MATTERS</text>
    <text x="550" y="843" font-size="16" fill="#f5f1e8">The Albany Congress was already meeting when Washington's defeat</text>
    <text x="550" y="863" font-size="16" fill="#f5f1e8">turned a diplomatic emergency into a larger war crisis.</text>
    <text x="1568" y="905" text-anchor="end" font-size="14" fill="#1a1a1a" stroke="#f5f1e8" stroke-width="4" paint-order="stroke">HIST 101 · Chapter 4 · Lecture 2</text>
  </g>
</svg>
