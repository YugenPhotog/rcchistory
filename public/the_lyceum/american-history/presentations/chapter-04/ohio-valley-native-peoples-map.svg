<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1664 934" role="img" aria-labelledby="title desc">
  <title id="title">Native peoples and communities of the mid-eighteenth-century Ohio Valley</title>
  <desc id="desc">A stylized map of the Ohio River Valley showing approximate locations of Shawnee, Lenape or Delaware, Mingos or Haudenosaunee migrants, Miami, and Great Lakes peoples, with Logstown near the Forks.</desc>
  <image x="0" y="0" width="1664" height="934" preserveAspectRatio="none" xlink:href="ohio-valley-native-peoples-map-base.png"/>
  <rect x="0" y="0" width="1664" height="934" fill="#1a1a1a" opacity=".10"/>

  <g font-family="Georgia, serif" fill="#1a1a1a" stroke="#f5f1e8" stroke-width="7" paint-order="stroke" stroke-linejoin="round">
    <text x="90" y="92" font-size="34" font-weight="700" fill="#6b4c9a">NATIVE PEOPLES AND COMMUNITIES</text>
    <text x="91" y="130" font-size="21" fill="#2c7873" stroke-width="5">Ohio Valley, c. 1750–1754 · approximate locations, not fixed borders</text>
  </g>

  <g fill="none" stroke-width="5" opacity=".72">
    <ellipse cx="555" cy="385" rx="210" ry="145" fill="#6b4c9a" fill-opacity=".13" stroke="#6b4c9a" stroke-dasharray="10 8"/>
    <ellipse cx="845" cy="535" rx="230" ry="130" fill="#9b2c2c" fill-opacity=".12" stroke="#9b2c2c" stroke-dasharray="10 8"/>
    <ellipse cx="1110" cy="390" rx="225" ry="130" fill="#2c7873" fill-opacity=".13" stroke="#2c7873" stroke-dasharray="10 8"/>
    <ellipse cx="370" cy="665" rx="210" ry="125" fill="#d4af37" fill-opacity=".14" stroke="#8b6f47" stroke-dasharray="10 8"/>
    <ellipse cx="1050" cy="185" rx="250" ry="95" fill="#1b4332" fill-opacity=".12" stroke="#1b4332" stroke-dasharray="10 8"/>
  </g>

  <g font-family="Georgia, serif" font-size="27" font-weight="700" fill="#1a1a1a" stroke="#f5f1e8" stroke-width="8" paint-order="stroke" stroke-linejoin="round">
    <text x="355" y="360">Lenape / Delaware</text>
    <text x="365" y="395" font-size="19" font-weight="400">communities in the upper Ohio</text>
    <text x="735" y="590">Shawnee</text>
    <text x="705" y="622" font-size="19" font-weight="400">towns along the central Ohio</text>
    <text x="1020" y="370">Mingoes</text>
    <text x="960" y="402" font-size="19" font-weight="400">Haudenosaunee migrants</text>
    <text x="242" y="705">Miami</text>
    <text x="205" y="737" font-size="19" font-weight="400">western Great Lakes / Wabash region</text>
    <text x="945" y="165">Great Lakes peoples</text>
    <text x="1000" y="197" font-size="19" font-weight="400">communities and displaced groups</text>
  </g>

  <g font-family="Georgia, serif" fill="#1a1a1a" stroke="#f5f1e8" stroke-width="7" paint-order="stroke">
    <circle cx="1138" cy="517" r="11" fill="#9b2c2c" stroke="#f5f1e8" stroke-width="5"/>
    <text x="1160" y="512" font-size="24" font-weight="700">Logstown</text>
    <text x="1160" y="542" font-size="18">near the Forks / present-day Pittsburgh region</text>
  </g>

  <g transform="translate(90 800)" font-family="Georgia, serif">
    <rect width="620" height="86" rx="12" fill="#f5f1e8" fill-opacity=".90" stroke="#8b6f47" stroke-width="3"/>
    <text x="20" y="30" font-size="18" font-weight="700" fill="#6b4c9a">Reading the map</text>
    <text x="20" y="55" font-size="16" fill="#1a1a1a">Markers show centers of residence, movement, or influence;</text>
    <text x="20" y="76" font-size="16" fill="#1a1a1a">they do not represent exclusive territorial boundaries.</text>
  </g>
  <text x="1570" y="905" text-anchor="end" font-family="Georgia, serif" font-size="14" fill="#1a1a1a" stroke="#f5f1e8" stroke-width="4" paint-order="stroke">HIST 101 · Chapter 4 · Lecture 2</text>
</svg>
