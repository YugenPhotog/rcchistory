<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 945" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Ink sky: charcoal → teal-ink → ruby dusk -->
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#0c1013"/>
      <stop offset="0.32" stop-color="#111c23"/>
      <stop offset="0.60" stop-color="#1a292d"/>
      <stop offset="0.85" stop-color="#332029"/>
      <stop offset="1" stop-color="#3f2229"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f8e8b8" stop-opacity="0.9"/>
      <stop offset="0.24" stop-color="#e2bd58" stop-opacity="0.62"/>
      <stop offset="0.56" stop-color="#bd7f3c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9b2c2c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.76">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.64" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.58"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="mistBlur" x="-50%" y="-60%" width="200%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.86  0 0 0 0 0.82  0 0 0 0 0.72  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>

    <!-- Stylized auspicious cloud (xiangyun) -->
    <g id="cloud">
      <path d="M-80,0 C-80,-16 -62,-27 -45,-22 C-39,-41 -11,-47 5,-34
               C17,-47 45,-43 51,-26 C69,-30 83,-16 80,0 Z"/>
      <path d="M80,0 C97,1 106,-11 99,-20 C94,-27 83,-24 83,-15"
            fill="none" stroke="#e8dcc0" stroke-width="4"/>
    </g>
  </defs>

  <!-- ============ SKY ============ -->
  <rect width="1680" height="945" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1180" cy="368" r="310" fill="url(#sunGlow)"/>
  <circle cx="1180" cy="368" r="120" fill="#f2dda4" opacity="0.26" filter="url(#soft)"/>
  <circle cx="1180" cy="368" r="97" fill="#f9eed6" opacity="0.55"/>

  <!-- Clouds -->
  <g fill="#e8dcc0">
    <use href="#cloud" transform="translate(392,246) scale(1.2)" opacity="0.09"/>
    <use href="#cloud" transform="translate(1444,208) scale(1.0)" opacity="0.12"/>
    <use href="#cloud" transform="translate(986,172) scale(0.8)" opacity="0.08"/>
  </g>

  <!-- Birds -->
  <g fill="none" stroke="#f0e6cd" stroke-width="2.6" stroke-linecap="round" opacity="0.4">
    <path d="M902,296 q9,-9 18,0"/>
    <path d="M932,282 q8,-8 16,0"/>
    <path d="M950,308 q7,-7 14,0"/>
  </g>

  <!-- ============ FAR KARST PEAKS ============ -->
  <g fill="#33454f" opacity="0.5">
    <path d="M28,612 C33,507 80,402 90,402 C100,402 147,507 152,612 Z"/>
    <path d="M184,614 C189,541 222,468 232,468 C242,468 275,541 280,614 Z"/>
    <path d="M318,616 C323,492 380,368 390,368 C400,368 457,492 462,616 Z"/>
    <path d="M493,616 C498,528 535,440 545,440 C555,440 592,528 597,616 Z"/>
    <path d="M624,618 C629,502 680,386 690,386 C700,386 751,502 756,618 Z"/>
    <path d="M799,618 C804,540 835,462 845,462 C855,462 886,540 891,618 Z"/>
    <path d="M932,620 C937,509 990,398 1000,398 C1010,398 1063,509 1068,620 Z"/>
    <path d="M1100,622 C1105,548 1170,474 1180,474 C1190,474 1255,548 1260,622 Z"/>
    <path d="M1280,620 C1285,508 1330,396 1340,396 C1350,396 1395,508 1400,620 Z"/>
    <path d="M1431,622 C1436,513 1485,404 1495,404 C1505,404 1554,513 1559,622 Z"/>
    <path d="M1598,622 C1603,537 1640,452 1650,452 C1660,452 1697,537 1702,622 Z"/>
  </g>

  <!-- mist behind the middle ridge -->
  <ellipse cx="840" cy="606" rx="900" ry="42" fill="#9dc4bf" opacity="0.16" filter="url(#mistBlur)"/>

  <!-- ============ MIDDLE KARST PEAKS ============ -->
  <g fill="#1a2b34">
    <path d="M94,702 C99,602 160,502 170,502 C180,502 241,602 246,702 Z"/>
    <path d="M386,706 C391,596 460,486 470,486 C480,486 549,596 554,706 Z"/>
    <path d="M708,708 C713,611 770,514 780,514 C790,514 847,611 852,708 Z"/>
    <path d="M1010,708 C1015,603 1080,498 1090,498 C1100,498 1165,603 1170,708 Z"/>
    <path d="M1324,710 C1329,609 1390,508 1400,508 C1410,508 1471,609 1476,710 Z"/>
    <path d="M1601,712 C1606,618 1655,524 1665,524 C1675,524 1724,618 1729,712 Z"/>
  </g>

  <!-- ============ RIDGE THAT CARRIES THE WALL ============ -->
  <path fill="#141f26"
        d="M-20,704 C200,664 330,694 470,654 C610,616 720,656 860,624
           C1000,594 1120,636 1250,604 C1380,574 1500,604 1700,576
           L1700,945 L-20,945 Z"/>

  <!-- ============ THE GREAT WALL ============ -->
  <g>
    <!-- wall body, stone catching the last light -->
    <path fill="none" stroke="#3c4750" stroke-width="13" stroke-linecap="round"
          d="M60,694 C200,654 330,684 470,644 C610,606 720,646 860,614
             C1000,584 1120,626 1250,594 C1380,564 1500,594 1660,566"/>
    <!-- shadowed underside -->
    <path fill="none" stroke="#0d151a" stroke-width="5" stroke-linecap="round" opacity="0.85"
          d="M60,701 C200,661 330,691 470,651 C610,613 720,653 860,621
             C1000,591 1120,633 1250,601 C1380,571 1500,601 1660,573"/>
    <!-- crenellations -->
    <g fill="#3c4750">
      <rect x="158" y="659" width="9" height="11"/>
      <rect x="260" y="653" width="9" height="11"/>
      <rect x="362" y="647" width="9" height="11"/>
      <rect x="565" y="612" width="9" height="11"/>
      <rect x="660" y="611" width="9" height="11"/>
      <rect x="755" y="611" width="9" height="11"/>
      <rect x="957" y="587" width="9" height="11"/>
      <rect x="1054" y="589" width="9" height="11"/>
      <rect x="1149" y="590" width="9" height="11"/>
      <rect x="1341" y="565" width="9" height="11"/>
      <rect x="1439" y="563" width="9" height="11"/>
      <rect x="1542" y="562" width="9" height="11"/>
    </g>
    <!-- watchtowers -->
    <g>
      <g fill="#39444d">
        <rect x="454" y="598" width="32" height="46"/>
        <rect x="449" y="589" width="42" height="10"/>
        <rect x="844" y="568" width="32" height="46"/>
        <rect x="839" y="559" width="42" height="10"/>
        <rect x="1234" y="548" width="32" height="46"/>
        <rect x="1229" y="539" width="42" height="10"/>
      </g>
      <g fill="#11191f">
        <rect x="462" y="610" width="7" height="10"/>
        <rect x="472" y="610" width="7" height="10"/>
        <rect x="852" y="580" width="7" height="10"/>
        <rect x="862" y="580" width="7" height="10"/>
        <rect x="1242" y="560" width="7" height="10"/>
        <rect x="1252" y="560" width="7" height="10"/>
      </g>
    </g>
  </g>

  <!-- valley mist below the wall -->
  <ellipse cx="700" cy="716" rx="820" ry="38" fill="#9dc4bf" opacity="0.15" filter="url(#mistBlur)"/>

  <!-- ============ FOREGROUND RIDGE ============ -->
  <path fill="#070a0d"
        d="M-20,760 C180,724 320,766 480,736 C640,706 780,756 940,728
           C1100,700 1260,750 1420,722 C1540,701 1620,726 1700,710
           L1700,945 L-20,945 Z"/>

  <!-- ============ PAGODA ============ -->
  <g fill="#04060a" transform="translate(0,32)">
    <rect x="1420" y="682" width="120" height="10"/>
    <rect x="1432" y="640" width="96" height="44"/>
    <path d="M1416,642 C1426,622 1534,622 1544,642 L1534,650 C1520,636 1440,636 1426,650 Z"/>
    <rect x="1440" y="600" width="80" height="42"/>
    <path d="M1423,602 C1433,583 1527,583 1537,602 L1527,610 C1514,597 1446,597 1433,610 Z"/>
    <rect x="1447" y="562" width="66" height="40"/>
    <path d="M1430,564 C1440,546 1520,546 1530,564 L1520,572 C1508,560 1452,560 1440,572 Z"/>
    <rect x="1453" y="526" width="54" height="38"/>
    <path d="M1436,528 C1446,511 1514,511 1524,528 L1514,536 C1503,525 1457,525 1446,536 Z"/>
    <rect x="1459" y="494" width="42" height="34"/>
    <path d="M1442,496 C1452,480 1508,480 1518,496 L1508,504 C1498,494 1462,494 1452,504 Z"/>
    <rect x="1477" y="462" width="6" height="32"/>
    <circle cx="1480" cy="458" r="6"/>
    <circle cx="1480" cy="444" r="3.5"/>
  </g>

  <!-- ============ PINES ON THE FOREGROUND RIDGE ============ -->
  <g fill="#04060a">
    <!-- tall pine -->
    <rect x="307" y="709" width="6" height="42"/>
    <path d="M276,713 L310,684 L344,713 Z"/>
    <path d="M283,695 L310,666 L337,695 Z"/>
    <path d="M290,677 L310,650 L330,677 Z"/>
    <!-- smaller pine -->
    <rect x="352" y="722" width="5" height="32"/>
    <path d="M330,726 L354,703 L378,726 Z"/>
    <path d="M336,710 L354,688 L372,710 Z"/>
  </g>

  <!-- ============ ATMOSPHERE ============ -->
  <rect width="1680" height="945" fill="url(#vignette)"/>
  <rect width="1680" height="945" filter="url(#grain)" opacity="0.5" fill="none" pointer-events="none"/>
</svg>
